name: Deploy PWA – Monitoreo 10SS

on:
  push:
    branches:
      - claude/build-offline-form-vtITc
      - claude/fix-appsheet-404-error-cU5yl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear ZIP de distribución
        run: zip -r monitoreo-10ss.zip . -x ".git/*" ".github/*"

      - name: Subir ZIP como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: monitoreo-10ss-${{ github.sha }}
          path: monitoreo-10ss.zip
          retention-days: 30

      - name: Preparar archivos para Pages
        run: |
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='monitoreo-10ss.zip' \
            . dist/

      - name: Publicar en GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
